models:
  seedance-2.5:
    display_name: 豆包 Seedance 2.5
    max_single_segment_seconds: 30
    max_reference_assets: 50
    supports_time_blocks: true
    supports_edit_instructions: true
    supports_native_languages: 10

  seedance-2.0:
    display_name: 豆包 Seedance 2.0
    max_single_segment_seconds: 10
    max_reference_assets: 10
    supports_time_blocks: false
    supports_edit_instructions: false

  hailuo-3:
    display_name: MiniMax Hailuo 3
    max_single_segment_seconds: 10
    modes: [T2VA, I2VA, FL2VA, L2VA, Ref2VA]
    reference_roles:
      image: 身份
      video: 动作
      audio: 节奏
    requires_timecodes: true
    supports_negative_field: true
