# ==============================================================
# 模型能力限制配置
# 适配日期: 2026-09-25
# 说明: 模型版本更新时只改此文件，不改技能逻辑。
#       每次技能启动时在输出第一行打印适配日期提醒。
# [更新日志]
# 2026-09-25: 初始版本。适配 Seedance 2.0/2.5、Hailuo 3。
# [兼容版本]
# 技能版本: >=2.0
# 导出/导入: 支持"导出配置"和"导入配置"指令，在设备间同步本文件。
